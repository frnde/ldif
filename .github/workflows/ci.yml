name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  go:
    name: Test & lint (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Test
        run: make test
      - name: Format
        run: make fmt
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Verify lint config
        run: golangci-lint config verify
      - name: Cache govulncheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ runner.os }}-v1.10.0
      - name: Vulnerability scan
        run: |
          command -v govulncheck >/dev/null || go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BL_VERSION: "1.10.1"
      BL_SHA256: "c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run betterleaks
        run: |
          curl -fsSL -o bl.tar.gz "https://github.com/betterleaks/betterleaks/releases/download/v${BL_VERSION}/betterleaks_${BL_VERSION}_linux_x64.tar.gz"
          echo "${BL_SHA256}  bl.tar.gz" | sha256sum -c -
          tar -xzf bl.tar.gz betterleaks
          ./betterleaks dir . -c .betterleaks.toml --no-banner --redact -v
